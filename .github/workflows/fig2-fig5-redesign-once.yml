name: One-shot Fig2/Fig5 redesign

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'redesign-fig2-fig5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply scoped plotting redesign
        run: python scripts/utils/apply_fig2_fig5_redesign_once.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      - name: Parse only changed plotting sources
        run: |
          Rscript -e "parse(file='scripts/13_plot_rq2.R'); parse(file='scripts/15_plot_rq3.R')"
      - name: Verify scope and whitespace
        run: |
          git diff --check
          changed=$(git diff --name-only HEAD -- scripts/13_plot_rq2.R scripts/15_plot_rq3.R | wc -l)
          test "$changed" -eq 2
          extra=$(git diff --name-only HEAD -- . ':!scripts/13_plot_rq2.R' ':!scripts/15_plot_rq3.R' | grep -v '^$' || true)
          test -z "$extra"
      - name: Commit generated plotting sources
        run: |
          git config user.name "ANooice-ckpt"
          git config user.email "yuxiaowang.pt@gmail.com"
          git add scripts/13_plot_rq2.R scripts/15_plot_rq3.R
          git commit -m "Redesign Fig2 and Fig5 plotting only"
          git push origin HEAD:${{ github.head_ref }}
