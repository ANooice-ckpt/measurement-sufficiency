name: One-shot relational workers

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cap relational preservation workers at 24
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/10_rq1_analysis.R')
          s = p.read_text()
          old = 'STARTUP_WORKERS <- ms_resolve_workers("RQ1_STARTUP_WORKERS", default = 36L, cap = 48L)\nFRAGMENT_WORKERS <- ms_resolve_workers("RQ1_FRAGMENT_WORKERS", default = 36L, cap = 48L)'
          new = 'STARTUP_WORKERS <- ms_resolve_workers("RQ1_STARTUP_WORKERS", default = 36L, cap = 48L)\nFRAGMENT_WORKERS <- ms_resolve_workers("RQ1_FRAGMENT_WORKERS", default = 36L, cap = 48L)\n# Relational preservation re-reads compressed canonical parts and returns paired\n# value vectors to the master process. Cap this I/O/memory-heavy scan below the\n# lighter summary-fragment stage on the production ECS.\nRELATIONAL_WORKERS <- min(24L, FRAGMENT_WORKERS)'
          if s.count(old) != 1:
              raise SystemExit('worker definition pattern mismatch')
          s = s.replace(old, new)
          old2 = 'message("RQ1 relational preservation over ", length(part_paths), " canonical parts; workers=", FRAGMENT_WORKERS)\nrank_schedule_idx <- order(as.numeric(file.info(part_paths)$size), decreasing = TRUE, na.last = TRUE)\nrank_fragments_scheduled <- ms_parallel_map(\n  part_paths[rank_schedule_idx], rq1_rank_fragment,\n  workers = FRAGMENT_WORKERS,'
          new2 = 'message("RQ1 relational preservation over ", length(part_paths), " canonical parts; workers=", RELATIONAL_WORKERS)\nrank_schedule_idx <- order(as.numeric(file.info(part_paths)$size), decreasing = TRUE, na.last = TRUE)\nrank_fragments_scheduled <- ms_parallel_map(\n  part_paths[rank_schedule_idx], rq1_rank_fragment,\n  workers = RELATIONAL_WORKERS,'
          if s.count(old2) != 1:
              raise SystemExit('relational scan pattern mismatch')
          p.write_text(s.replace(old2, new2))

          p = Path('docs/RQ1_EXECUTION.md')
          s = p.read_text()
          old = '`RQ1_STARTUP_WORKERS` parallelizes duration-anchor startup scans, `RQ1_PART_WORKERS` parallelizes immutable canonical-part generation, `RQ1_FRAGMENT_WORKERS` parallelizes summary-fragment checkpoints, and `RQ1_BOOT_WORKERS` controls the participant-cluster/site-stratified bootstrap workers. The startup, duration-part and fragment schedules retain the validated large-task-first/LPT-style ordering.'
          new = '`RQ1_STARTUP_WORKERS` parallelizes duration-anchor startup scans, `RQ1_PART_WORKERS` parallelizes immutable canonical-part generation, `RQ1_FRAGMENT_WORKERS` parallelizes summary-fragment checkpoints, and `RQ1_BOOT_WORKERS` controls the participant-cluster/site-stratified bootstrap workers. Relational-preservation analysis re-reads compressed canonical parts and returns paired value vectors, so this I/O/memory-heavy stage is intentionally capped at 24 concurrent workers even though `RQ1_FRAGMENT_WORKERS` remains 36. The startup, duration-part, fragment and relational schedules retain the validated large-task-first/LPT-style ordering.'
          if s.count(old) != 1:
              raise SystemExit('documentation pattern mismatch')
          p.write_text(s.replace(old, new))
          PY

          grep -F 'RELATIONAL_WORKERS <- min(24L, FRAGMENT_WORKERS)' scripts/10_rq1_analysis.R
          grep -F 'workers=", RELATIONAL_WORKERS' scripts/10_rq1_analysis.R
          git diff --check

      - name: Commit and remove updater
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-relational-workers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/10_rq1_analysis.R docs/RQ1_EXECUTION.md .github/workflows/one-shot-relational-workers.yml
          git commit -m "Cap RQ1 relational preservation at 24 workers"
          git push origin HEAD:master
