name: One-shot Fig5 tolerance-slice redesign

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/15_plot_rq3.R'
      - 'scripts/utils/patch_fig5_tolerance_slices_once.py'
      - '.github/workflows/patch-fig5-tolerance-slices-once.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply Fig5 redesign
        run: python scripts/utils/patch_fig5_tolerance_slices_once.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      - name: Parse plotting source
        shell: Rscript {0}
        run: parse(file = 'scripts/15_plot_rq3.R')
      - name: Enforce Fig5 invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/15_plot_rq3.R').read_text(encoding='utf-8')
          assert text.count('"Fig5_RQ3.png"') == 1, 'Fig5 PNG must have one writer'
          assert text.count('"Fig5_RQ3.pdf"') == 1, 'Fig5 PDF must have one writer'
          for token in (
              'Conditional marginal returns reveal joint trade-offs',
              'FigS_RQ3_pareto_facets',
              'pareto_persistence',
              'fraction_ever_pareto',
              'fig5_duration_marginal_gain.csv',
              'fig5_temporal_marginal_gain.csv',
          ):
              assert token not in text, f'legacy Fig5 token remains: {token}'
          for token in (
              'Jointly sufficient regions expand as tolerance relaxes',
              'fraction_confirmed_sufficient',
              'FIG5_TOLERANCE_SLICES',
              'coverage-efficient frontier',
              'fig5_tolerance_slice_coverage.csv',
          ):
              assert token in text, f'required Fig5 token missing: {token}'
          PY
          git diff --check
      - name: Commit redesigned plotting source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/15_plot_rq3.R
          if ! git diff --cached --quiet; then
            git commit -m 'Redesign Fig5 with tolerance-resolved feasible regions'
            git push origin HEAD:${{ github.head_ref }}
          fi
