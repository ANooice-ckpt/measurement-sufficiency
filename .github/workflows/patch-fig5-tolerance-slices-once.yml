name: One-shot Fig5 tolerance-slice redesign

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/15_plot_rq3.R'
      - 'scripts/utils/patch_fig5_tolerance_slices_once.py'
      - '.github/workflows/patch-fig5-tolerance-slices-once.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply Fig5 redesign
        run: python scripts/utils/patch_fig5_tolerance_slices_once.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      - name: Parse plotting source
        shell: Rscript {0}
        run: parse(file = 'scripts/15_plot_rq3.R')
      - name: Enforce Fig5 invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '"'"'Fig5_RQ3.png'"'"' scripts/15_plot_rq3.R)" -eq 1
          test "$(grep -c '"'"'Fig5_RQ3.pdf'"'"' scripts/15_plot_rq3.R)" -eq 1
          ! grep -q 'Conditional marginal returns reveal joint trade-offs' scripts/15_plot_rq3.R
          ! grep -q 'FigS_RQ3_pareto_facets' scripts/15_plot_rq3.R
          ! grep -q 'pareto_persistence' scripts/15_plot_rq3.R
          grep -q 'Jointly sufficient regions expand as tolerance relaxes' scripts/15_plot_rq3.R
          grep -q 'fraction_confirmed_sufficient' scripts/15_plot_rq3.R
          grep -q 'FIG5_TOLERANCE_SLICES <- c(.10, .25, .50, .75)' scripts/15_plot_rq3.R
          git diff --check
      - name: Commit redesigned plotting source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/15_plot_rq3.R
          if ! git diff --cached --quiet; then
            git commit -m 'Redesign Fig5 with tolerance-resolved feasible regions'
            git push origin HEAD:${{ github.head_ref }}
          fi
