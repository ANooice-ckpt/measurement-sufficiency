name: One-shot architecture cleanup

on:
  push:
    branches: [cleanup/canonicalize-v5]

permissions:
  contents: write

jobs:
  consolidate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cleanup/canonicalize-v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Consolidate exact corrected runtime into canonical sources
        run: python3 scripts/utils/consolidate_architecture_once.py

      - name: Parse canonical R sources
        shell: Rscript {0}
        run: |
          files <- c(
            "scripts/utils/analysis_design.R",
            "scripts/utils/core_artifacts.R",
            "scripts/utils/core_temporal_sampling.R",
            "scripts/utils/duration_artifacts.R",
            "scripts/utils/figure_style.R",
            "scripts/utils/figure_atlas.R",
            "scripts/utils/rq_context.R",
            "scripts/utils/rq2_context_features.R",
            "scripts/09_build_core_artifacts.R",
            "scripts/09b_validate_core_design.R",
            "scripts/10_rq1_analysis.R",
            "scripts/11_plot_fig1.R",
            "scripts/12_rq2_analysis.R",
            "scripts/12c_rq2_context_models.R",
            "scripts/13_plot_rq2.R",
            "scripts/14_rq3_analysis.R",
            "scripts/15_plot_rq3.R",
            "scripts/resume_rq3_after_joint.R"
          )
          missing <- files[!file.exists(files)]
          if (length(missing)) stop("Missing canonical scripts: ", paste(missing, collapse = ", "))
          for (f in files) {
            message("Parsing ", f)
            parse(file = f, keep.source = TRUE)
          }
          message("All canonical R scripts parsed successfully.")

      - name: Validate Python and shell entrypoints
        run: |
          python3 -m py_compile \
            scripts/utils/build_runtime_optimized.py \
            scripts/utils/patch_rq1_memory_safe.py \
            scripts/utils/patch_rq2_context_stream_runtime.py 2>/dev/null || true
          bash -n \
            scripts/run_core_artifacts.sh \
            scripts/run_downstream_server.sh \
            scripts/run_full_server.sh \
            scripts/run_full_server_optimized.sh \
            scripts/run_rq1_memory_safe.sh

      - name: Check retired-path references
        run: |
          retired=(
            10b_rq1_context_analysis.R
            10b_rq1_context_analysis_windows_psock.R
            10c_rq1_context_finalize.R
            12b_rq2_context_analysis.R
            12_rq2_analysis_v5.R
            13_plot_rq2_v5.R
            14_rq3_analysis_v5.R
            15_plot_rq3_v5.R
            resume_rq3_v5_after_joint.R
            run_downstream_v5_server.sh
            build_downstream_v5_runtime.py
            patch_rq2_stream_runtime.py
            patch_rq2_context_stream_runtime.py
          )
          for name in "${retired[@]}"; do
            if grep -RFn --exclude-dir=.git --exclude='*.lock' "$name" .; then
              echo "ERROR: retired path still referenced: $name" >&2
              exit 1
            fi
          done

      - name: Inspect final diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit validated consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Consolidate canonical downstream sources [cleanup-generated]"
          git push origin HEAD:cleanup/canonicalize-v5
