name: One-shot robust RQ2/RQ3 display repair

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply robust display repair
        run: python scripts/utils/repair_robust_rq2_rq3_display_once.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      - name: Parse plotting sources
        run: |
          Rscript -e "parse(file='scripts/13_plot_rq2.R'); parse(file='scripts/15_plot_rq3.R')"
      - name: Enforce reported-bug invariants
        run: |
          ! grep -q 'direction_shift_summary' scripts/13_plot_rq2.R
          ! grep -q 'r_limit <- max(abs(gamma_metric\$R_metric)' scripts/13_plot_rq2.R
          ! grep -q 'q_limit <- max(gamma_metric\$Q_metric' scripts/13_plot_rq2.R
          test "$(grep -c 'Fig2_RQ2.png' scripts/13_plot_rq2.R)" -eq 1
          test "$(grep -c 'Fig2_RQ2.pdf' scripts/13_plot_rq2.R)" -eq 1
          test "$(grep -c 'Fig3_RQ2.png' scripts/13_plot_rq2.R)" -eq 1
          test "$(grep -c 'Fig3_RQ2.pdf' scripts/13_plot_rq2.R)" -eq 1
          test "$(grep -c 'Fig4_RQ3.png' scripts/15_plot_rq3.R)" -eq 1
          test "$(grep -c 'Fig4_RQ3.pdf' scripts/15_plot_rq3.R)" -eq 1
          test "$(grep -c 'Fig5_RQ3.png' scripts/15_plot_rq3.R)" -eq 1
          test "$(grep -c 'Fig5_RQ3.pdf' scripts/15_plot_rq3.R)" -eq 1
          git diff --check
      - name: Commit repaired plotting sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/13_plot_rq2.R scripts/15_plot_rq3.R
          if ! git diff --cached --quiet; then
            git commit -m 'Repair robust display scaling in Fig2 and Fig3'
            git push origin HEAD:${{ github.head_ref }}
          fi
