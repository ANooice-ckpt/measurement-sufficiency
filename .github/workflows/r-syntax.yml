name: R syntax

on:
  pull_request:
  push:
    branches: [master]

jobs:
  parse-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Parse every R source
        shell: Rscript {0}
        run: |
          files <- sort(list.files("scripts", pattern = "\\.R$", recursive = TRUE, full.names = TRUE))
          if (!length(files)) stop("No R scripts found")
          invisible(lapply(files, parse))
          message("All ", length(files), " R scripts parsed successfully.")
      - name: Check every shell script
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            bash -n "${file}"
          done < <(find scripts -type f -name '*.sh' -print0)
