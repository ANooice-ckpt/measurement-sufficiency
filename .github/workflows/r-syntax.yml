name: R syntax

on:
  pull_request:
  push:
    branches: [master]

jobs:
  parse-r-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Parse manuscript analysis and plotting scripts
        shell: Rscript {0}
        run: |
          files <- c(
            "scripts/utils/figure_style.R",
            "scripts/utils/figure_atlas.R",
            "scripts/10_rq1_analysis.R",
            "scripts/10b_rq1_context_analysis.R",
            "scripts/11_plot_fig1.R",
            "scripts/12_rq2_analysis.R",
            "scripts/12b_rq2_context_analysis.R",
            "scripts/13_plot_rq2.R",
            "scripts/14_rq3_analysis.R",
            "scripts/15_plot_rq3.R"
          )
          missing <- files[!file.exists(files)]
          if (length(missing)) stop("Missing scripts: ", paste(missing, collapse = ", "))
          for (f in files) {
            message("Parsing ", f)
            parse(file = f, keep.source = TRUE)
          }
          message("All R scripts parsed successfully.")
