name: R syntax

on:
  pull_request:
  push:
    branches: [master]

jobs:
  parse-r-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Parse manuscript analysis and plotting scripts
        shell: Rscript {0}
        run: |
          files <- c(
            "scripts/utils/analysis_design.R",
            "scripts/utils/core_artifacts.R",
            "scripts/utils/core_temporal_sampling.R",
            "scripts/utils/duration_artifacts.R",
            "scripts/utils/figure_style.R",
            "scripts/utils/figure_atlas.R",
            "scripts/utils/rq_context.R",
            "scripts/utils/rq2_context_features.R",
            "scripts/09_build_core_artifacts.R",
            "scripts/09b_validate_core_design.R",
            "scripts/10_rq1_analysis.R",
            "scripts/11_plot_fig1.R",
            "scripts/12_rq2_analysis.R",
            "scripts/12c_rq2_context_models.R",
            "scripts/13_plot_rq2.R",
            "scripts/14_rq3_analysis.R",
            "scripts/15_plot_rq3.R",
            "scripts/resume_rq3_after_joint.R"
          )
          missing <- files[!file.exists(files)]
          if (length(missing)) stop("Missing scripts: ", paste(missing, collapse = ", "))
          for (f in files) {
            message("Parsing ", f)
            parse(file = f, keep.source = TRUE)
          }
          message("All R scripts parsed successfully.")
      - name: Check frozen plotting semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          f11 = Path("scripts/11_plot_fig1.R").read_text(encoding="utf-8")
          f13 = Path("scripts/13_plot_rq2.R").read_text(encoding="utf-8")
          f15 = Path("scripts/15_plot_rq3.R").read_text(encoding="utf-8")
          doc = Path("docs/FIGURE_ARCHITECTURE.md").read_text(encoding="utf-8")
          assert "metric_class" in f11[f11.index("rank_cache_required"):f11.index("rank_cache_valid")]
          assert "rq2_layered_context_model_coefficients.csv" in f13
          assert "rq2_layered_context_model_performance.csv" in f13
          assert "fraction of evaluable metrics with CV R² > 0" in f13
          assert "display_threshold_like = threshold_like_at" in f15
          assert "canonical RQ3 threshold-like requirement" in f15
          assert "does not contain exactly the frozen primary temporal states" in f15
          assert "does not contain exactly the frozen primary duration states" in f15
          assert "c(1800, 900, 300, 60, 30, 20, 10)" not in f15
          assert f15.count("p4a_main <-") == 1
          assert f15.count("fig4 <- cowplot::plot_grid(") == 1
          assert f15.count("FIG5_TOLERANCE_SLICES <-") == 1
          assert "threshold-like" in doc
          assert "joint-analysis target-metric universe" in doc
          PY
      - name: Check server runner shell syntax
        run: |
          bash -n \
            scripts/run_core_artifacts.sh \
            scripts/run_downstream_server.sh \
            scripts/run_full_server.sh \
            scripts/run_full_server_optimized.sh \
            scripts/run_rq1_memory_safe.sh