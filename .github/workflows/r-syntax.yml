name: R syntax

on:
  pull_request:
  push:
    branches: [master]

jobs:
  parse-r-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Parse manuscript analysis and plotting scripts
        shell: Rscript {0}
        run: |
          files <- c(
            "scripts/utils/analysis_design.R",
            "scripts/utils/core_artifacts.R",
            "scripts/utils/core_temporal_sampling.R",
            "scripts/utils/duration_artifacts.R",
            "scripts/utils/figure_style.R",
            "scripts/utils/figure_atlas.R",
            "scripts/utils/rq_context.R",
            "scripts/utils/rq2_context_features.R",
            "scripts/09_build_core_artifacts.R",
            "scripts/09b_validate_core_design.R",
            "scripts/10_rq1_analysis.R",
            "scripts/10b_rq1_context_analysis.R",
            "scripts/11_plot_fig1.R",
            "scripts/12_rq2_analysis.R",
            "scripts/12_rq2_analysis_v5.R",
            "scripts/12b_rq2_context_analysis.R",
            "scripts/12c_rq2_context_models.R",
            "scripts/13_plot_rq2.R",
            "scripts/13_plot_rq2_v5.R",
            "scripts/14_rq3_analysis.R",
            "scripts/14_rq3_analysis_v5.R",
            "scripts/15_plot_rq3.R",
            "scripts/15_plot_rq3_v5.R",
            "scripts/resume_rq3_v5_after_joint.R"
          )
          missing <- files[!file.exists(files)]
          if (length(missing)) stop("Missing scripts: ", paste(missing, collapse = ", "))
          for (f in files) {
            message("Parsing ", f)
            parse(file = f, keep.source = TRUE)
          }
          message("All R scripts parsed successfully.")
      - name: Parse runtime patch builder
        run: python3 -m py_compile scripts/utils/build_downstream_v5_runtime.py
      - name: Check server runner shell syntax
        run: |
          bash -n \
            scripts/run_core_artifacts.sh \
            scripts/run_downstream_v5_server.sh \
            scripts/run_downstream_server.sh \
            scripts/run_full_server.sh \
            scripts/run_full_server_optimized.sh
