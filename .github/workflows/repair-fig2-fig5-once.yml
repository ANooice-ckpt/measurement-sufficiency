name: One-shot Fig2/Fig5 single-writer repair

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply definitive plotting repair
        run: python scripts/utils/repair_fig2_fig5_once.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      - name: Parse changed plotting sources
        run: |
          Rscript -e "parse(file='scripts/13_plot_rq2.R'); parse(file='scripts/15_plot_rq3.R')"
      - name: Enforce single canonical main-figure writers
        run: |
          test "$(grep -c 'Fig2_RQ2.png' scripts/13_plot_rq2.R)" -eq 1
          test "$(grep -c 'Fig2_RQ2.pdf' scripts/13_plot_rq2.R)" -eq 1
          test "$(grep -c 'Fig5_RQ3.png' scripts/15_plot_rq3.R)" -eq 1
          test "$(grep -c 'Fig5_RQ3.pdf' scripts/15_plot_rq3.R)" -eq 1
          ! grep -q 'Conditional distortion magnitude across exposure state' scripts/13_plot_rq2.R
          ! grep -q 'No matched grouped-CV results' scripts/13_plot_rq2.R
          ! grep -q 'Persistent Pareto occupancy across joint measurement burden' scripts/15_plot_rq3.R
          ! grep -q 'pareto_global_display' scripts/15_plot_rq3.R
          git diff --check
      - name: Commit repaired canonical plotting sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/13_plot_rq2.R scripts/15_plot_rq3.R
          if ! git diff --cached --quiet; then
            git commit -m 'Repair Fig2 and Fig5 canonical plotting writers'
            git push origin HEAD:${{ github.head_ref }}
          fi
