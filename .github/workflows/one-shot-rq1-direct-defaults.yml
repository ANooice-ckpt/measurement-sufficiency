name: One-shot RQ1 direct defaults

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align standalone RQ1 defaults with production ECS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/10_rq1_analysis.R')
          text = p.read_text()
          old = '''BOOT_WORKERS <- ms_resolve_workers("RQ1_BOOT_WORKERS", default = 1L, cap = 48L)
          rq1_default_part_workers <- function() {
            logical <- suppressWarnings(parallel::detectCores(logical = TRUE))
            physical <- suppressWarnings(parallel::detectCores(logical = FALSE))
            detected <- if (is.finite(physical) && physical > 0) physical else logical
            if (!is.finite(detected) || detected < 1) return(1L)
            max(1L, min(24L, as.integer(floor(detected / 2))))
          }
          PART_WORKERS <- ms_resolve_workers("RQ1_PART_WORKERS", default = rq1_default_part_workers(), cap = 48L)'''.replace('          ', '')
          new = '''# Production worker defaults are validated on the 48-vCPU / 192-GiB ECS deployment.
          # Environment overrides remain available for different hardware or diagnostics.
          BOOT_WORKERS <- ms_resolve_workers("RQ1_BOOT_WORKERS", default = 40L, cap = 48L)
          PART_WORKERS <- ms_resolve_workers("RQ1_PART_WORKERS", default = 44L, cap = 48L)'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy RQ1 worker-default block, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RQ1_BOOT_WORKERS", default = 40L, cap = 48L' scripts/10_rq1_analysis.R
          grep -F 'RQ1_PART_WORKERS", default = 44L, cap = 48L' scripts/10_rq1_analysis.R
          grep -F 'RQ1_STARTUP_WORKERS", default = 36L, cap = 48L' scripts/10_rq1_analysis.R
          grep -F 'RQ1_FRAGMENT_WORKERS", default = 36L, cap = 48L' scripts/10_rq1_analysis.R
          ! grep -Fq 'rq1_default_part_workers' scripts/10_rq1_analysis.R
          git diff --check

      - name: Commit and remove updater
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-rq1-direct-defaults.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/10_rq1_analysis.R .github/workflows/one-shot-rq1-direct-defaults.yml
          git commit -m "Align standalone RQ1 defaults with production ECS"
          git push origin HEAD:master
