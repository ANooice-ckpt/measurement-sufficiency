name: One-shot final figure polish

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/11_plot_fig1.R'
      - 'scripts/13_plot_rq2.R'
      - 'scripts/15_plot_rq3.R'
      - '.github/workflows/patch-five-figures-once.yml'

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply final plotting polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              return text.replace(old, new, 1)

          p = Path('scripts/11_plot_fig1.R')
          t = p.read_text(encoding='utf-8')
          t = one(t,
          '''rank_cache_valid <- nrow(rank_cache) > 0 && all(rank_cache_required %in% names(rank_cache)) &&
            identical(unique(na.omit(rank_cache$core_artifact_version)), CORE_VERSION) &&
            identical(unique(na.omit(rank_cache$rq1_analysis_version)), RQ1_VERSION)
          ''',
          '''rank_cache_core <- unique(rank_cache$core_artifact_version[!is.na(rank_cache$core_artifact_version)])
          rank_cache_rq1 <- unique(rank_cache$rq1_analysis_version[!is.na(rank_cache$rq1_analysis_version)])
          rank_cache_valid <- nrow(rank_cache) > 0 && all(rank_cache_required %in% names(rank_cache)) &&
            length(rank_cache_core) == 1L && identical(rank_cache_core[[1]], CORE_VERSION) &&
            length(rank_cache_rq1) == 1L && identical(rank_cache_rq1[[1]], RQ1_VERSION)
          ''', 'Fig1 cache identity')
          t = one(t,
          '''  group_by(facet_label) |>
            slice_max(A_mean_absolute, n = 1, with_ties = FALSE) |>
            ungroup()
          target_label_coherent <- target_geometry |>
          ''',
          '''  group_by(facet_label) |>
            slice_max(A_mean_absolute, n = 1, with_ties = FALSE) |>
            ungroup() |>
            mutate(label_role = "max A")
          target_label_coherent <- target_geometry |>
          ''', 'Fig1 max-A role')
          t = one(t,
          '''  group_by(facet_label) |>
            slice_max(direction_coherence, n = 1, with_ties = FALSE) |>
            ungroup()
          target_labels <- bind_rows(target_label_max_a, target_label_coherent) |>
            distinct(facet_label, metric, .keep_all = TRUE)
          ''',
          '''  group_by(facet_label) |>
            slice_max(direction_coherence, n = 1, with_ties = FALSE) |>
            ungroup() |>
            mutate(label_role = "max |B|/A")
          target_labels <- bind_rows(target_label_max_a, target_label_coherent) |>
            group_by(facet_label, metric) |>
            mutate(label_role = paste(unique(label_role), collapse = " + ")) |>
            slice_head(n = 1) |>
            ungroup()
          ''', 'Fig1 coherence role')
          t = one(t,
          '    aes(B_mean_signed, A_mean_absolute, label = metric),\n',
          '    aes(B_mean_signed, A_mean_absolute, label = paste0(metric, " · ", label_role)),\n',
          'Fig1 semantic point labels')
          subtitle_line = '    subtitle = "labels mark maximum A and maximum |B|/A · toward |B| = A means more coherent directional change",\n'
          if t.count(subtitle_line) != 1:
              raise SystemExit('Fig1b subtitle line not found exactly once')
          t = t.replace(subtitle_line, '', 1)
          long_title = '    "c  Ordered-axis local response · dotted line = equal share across adjacent steps",\n'
          short_title = '    "c  Ordered-axis local response · dotted = equal share",\n'
          if t.count(long_title) != 1:
              raise SystemExit('Fig1 local-response title not found exactly once')
          t = t.replace(long_title, short_title, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('scripts/13_plot_rq2.R')
          t = p.read_text(encoding='utf-8')
          t = one(t,
          '    scale_color_manual(values = PREDICTOR_COLORS, drop = FALSE) +\n',
          '''    scale_color_manual(
              values = PREDICTOR_COLORS, drop = FALSE,
              labels = c(
                "External opportunity" = "External",
                "Micro-environment" = "Micro-env.",
                "Behaviour" = "Behaviour",
                "Exposure state" = "Exposure state"
              )
            ) +
          ''', 'Fig2 concise context legend')
          t = t.replace(
              '# supplement; the direction shift remains Fig. 2c.',
              '# supplement; Fig. 2c reports held-out contextual predictability.'
          )
          t = t.replace(
              'message("RQ2 v5 figures complete: Fig. 2 separates exposure-state distributions, predictor-level contextual effects, and direction shifts; Fig. 3 retains cross-dimensional interaction geometry.")',
              'message("RQ2 v5 figures complete: Fig. 2 combines state-conditioned geometry, layered contextual effects and held-out predictability; Fig. 3 reports interaction sign, magnitude and coherence.")'
          )
          t = one(t,
          '''  ) |>
            group_by(dimension_pair) |>
            slice_max(Q_median, n = 4, with_ties = FALSE) |>
          ''',
          '''  ) |>
            mutate(
              coherence_median = if_else(
                is.finite(coherence_median),
                pmax(-1, pmin(1, coherence_median)), NA_real_
              )
            ) |>
            group_by(dimension_pair) |>
            slice_max(Q_median, n = 4, with_ties = FALSE) |>
          ''', 'Fig3 bound R/Q coherence')
          p.write_text(t, encoding='utf-8')
          PY
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      - name: Parse canonical plotting sources
        shell: Rscript {0}
        run: |
          parse(file = 'scripts/11_plot_fig1.R')
          parse(file = 'scripts/13_plot_rq2.R')
          parse(file = 'scripts/15_plot_rq3.R')
      - name: Enforce final invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          f1 = Path('scripts/11_plot_fig1.R').read_text(encoding='utf-8')
          f23 = Path('scripts/13_plot_rq2.R').read_text(encoding='utf-8')
          f45 = Path('scripts/15_plot_rq3.R').read_text(encoding='utf-8')
          for text, stem in ((f1,'Fig1_RQ1'), (f23,'Fig2_RQ2'), (f23,'Fig3_RQ2'), (f45,'Fig4_RQ3'), (f45,'Fig5_RQ3')):
              assert text.count(f'"{stem}.png"') == 1
              assert text.count(f'"{stem}.pdf"') == 1
          assert 'rank_cache_core' in f1 and 'max |B|/A' in f1 and 'dotted = equal share' in f1
          assert 'Micro-env.' in f23 and 'median R / Q' in f23 and 'pmax(-1, pmin(1, coherence_median))' in f23
          assert 'fig5_slice_guides' in f45 and 'epsilon50' in f45 and 'class_strip_labels' in f45
          PY
          git diff --check
      - name: Commit final plotting polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/11_plot_fig1.R scripts/13_plot_rq2.R scripts/15_plot_rq3.R
          if ! git diff --cached --quiet; then
            git commit -m 'Polish in-place figure annotations'
            git push origin HEAD:${{ github.head_ref }}
          fi
