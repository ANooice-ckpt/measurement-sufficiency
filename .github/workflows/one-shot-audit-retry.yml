name: One-shot audit retry

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Apply the audited transformation atomically
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-shot-audit-cleanup.yml').read_text(encoding='utf-8')
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          bad = 'rq1_assert_summary_version(pairwise_artifact if FALSE else rq1_artifact, pair_summary)'
          good = 'rq1_assert_summary_version(rq1_artifact, pair_summary)'
          if script.count(bad) != 1:
              raise RuntimeError(f'expected one known audit-script defect, found {script.count(bad)}')
          script = script.replace(bad, good, 1)
          exec(compile(script, '<audited-cleanup>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Parse every R source after cleanup
        shell: Rscript {0}
        run: |
          files <- sort(list.files("scripts", pattern = "\\.R$", recursive = TRUE, full.names = TRUE))
          if (!length(files)) stop("No R scripts found")
          invisible(lapply(files, parse))
          message("All ", length(files), " R scripts parsed successfully.")
      - name: Check every shell script after cleanup
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            bash -n "${file}"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: Commit only the validated tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f Rplots.pdf .github/workflows/one-shot-audit-cleanup.yml .github/workflows/one-shot-audit-retry.yml
          git add -A
          git commit -m "Finalize canonical audit cleanup"
          git push
